packages:
  - desktop
  - landing

allowBuilds:
  # Browser/WASM text inference needs no native postinstall downloads or image tooling.
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  workerd: true

# pdf.js only reads text here (decision 0149); its optional canvas binding draws pages.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"
