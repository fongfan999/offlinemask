<!doctype html>
<!-- Source of og.png (1200×630). Render: see landing/README.md, "Share image". -->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Noto Sans";
        font-weight: 100 900;
        src: url(../node_modules/@fontsource-variable/noto-sans/files/noto-sans-vietnamese-wght-normal.woff2);
        unicode-range:
          U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301,
          U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: "Noto Sans";
        font-weight: 100 900;
        src: url(../node_modules/@fontsource-variable/noto-sans/files/noto-sans-latin-wght-normal.woff2);
        unicode-range: U+0000-00FF, U+2000-206F;
      }
      @font-face {
        font-family: "Noto Serif";
        font-style: italic;
        font-weight: 100 900;
        src: url(../node_modules/@fontsource-variable/noto-serif/files/noto-serif-vietnamese-wght-italic.woff2);
        unicode-range:
          U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301,
          U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: "Noto Serif";
        font-style: italic;
        font-weight: 100 900;
        src: url(../node_modules/@fontsource-variable/noto-serif/files/noto-serif-latin-wght-italic.woff2);
        unicode-range: U+0000-00FF, U+2000-206F;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #f7f5ee;
        color: #262a25;
        font-family: "Noto Sans", sans-serif;
        box-sizing: border-box;
        padding: 72px 80px;
        display: grid;
        grid-template-columns: 1fr 400px;
        gap: 56px;
        align-items: center;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 30px;
        font-weight: 750;
        letter-spacing: -1px;
      }
      .brand span {
        color: #3453b6;
      }
      .mark {
        width: 56px;
        height: 56px;
        background: #3453b6;
        mask: url(../../brand/mark-mono-black.svg) center / contain no-repeat;
      }
      h1 {
        text-wrap: balance;
        font-size: 62px;
        line-height: 1.18;
        letter-spacing: -0.04em;
        font-weight: 580;
        margin: 44px 0 0;
      }
      em {
        display: block;
        font-family: "Noto Serif", serif;
        font-weight: 400;
        color: #3453b6;
        letter-spacing: -0.02em;
      }
      .sheet {
        background: #fcfaf4;
        border: 1px solid #bfc2b4;
        border-radius: 18px;
        padding: 28px;
        box-shadow: 8px 8px 0 #e3e9fd;
        font-size: 21px;
        line-height: 2.1;
      }
      .label {
        font-size: 15px;
        color: #595d54;
        border-bottom: 1px solid #d9d9cd;
        padding-bottom: 12px;
        margin-bottom: 14px;
      }
      code {
        font:
          17px "Noto Sans",
          sans-serif;
        color: #3453b6;
        background: #e3e9fd;
        border-radius: 6px;
        padding: 3px 9px;
      }
      .foot {
        font-size: 15px;
        color: #595d54;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="brand">
        <i class="mark"></i><b>Offline<span>Mask</span></b>
      </div>
      <h1>Dùng AI với dữ liệu thật.<em>Không lộ thông tin.</em></h1>
    </div>
    <div class="sheet">
      <div class="label">Bản đã ẩn · gửi cho AI</div>
      Khách hàng <code>[TEN_1]</code><br />
      Tài khoản <code>[STK_1]</code><br />
      Liên hệ <code>[EMAIL_1]</code>
      <div class="foot">● Xử lý ngay trên máy bạn</div>
    </div>
  </body>
</html>
