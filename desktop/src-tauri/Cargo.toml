# Cargo workspace: this app package and the recognition helper (decision 0107).
# The version lives once, under [workspace.package]; the release workflow reads it there.
[workspace]
members = ["recognition-sidecar"]

[workspace.package]
version = "2.3.0"

[package]
name = "offlinemask"
version.workspace = true
description = "Offline desktop workspace for reviewing sensitive data"
edition = "2021"
default-run = "OfflineMask"

[features]
recognition-evaluation = []
recognition-native-desktop = ["dep:ort"]
recognition-native-sidecar = ["recognition-native-desktop"]
recognition-native-release = ["recognition-native-sidecar"]
native-inference-prototype = ["dep:ort"]
minilm-desktop-prototype = ["dep:minilm-tokenizer"]
minilm-native-desktop-prototype = ["minilm-desktop-prototype", "dep:ort"]

# The app binary carries the product name: an unbundled `tauri dev` run shows it in the Dock.
[[bin]]
name = "OfflineMask"
path = "src/main.rs"

[[bin]]
name = "offlinemask-native-prototype"
path = "src/bin/native_inference_prototype.rs"
required-features = ["native-inference-prototype"]

[[bin]]
name = "recognition-native-check"
path = "src/bin/recognition_native_check.rs"
required-features = ["native-inference-prototype"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "recognition-tokenizer-check"
path = "src/bin/recognition_tokenizer_check.rs"
required-features = ["recognition-evaluation"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "offlinemask_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zstd = { version = "0.14", default-features = false }
fs2 = "0.4"
argon2 = "0.6"
chacha20poly1305 = "0.11"
getrandom = "0.3"
zeroize = "1"
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
ort = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = ["std", "load-dynamic"] }
minilm-tokenizer = { package = "offlinemask-minilm-tokenizer-prototype", path = "../scripts/minilm-native/native", optional = true }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-fs = "=2.5.2"
tauri-plugin-clipboard-manager = "=2.5.0"
enigo = "=0.6.1"


# A freshly installed pack is verified by hashing 1.1 GB once. Unoptimized
# SHA-256 took over 30 s on an M1 Pro in `tauri dev`; optimize just that crate.
[profile.dev.package.sha2]
opt-level = 3
# Argon2id at 64 MiB takes seconds unoptimized; an unlock should not.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Thin LTO with Cargo's default 16 codegen units (decision 0104): the fat LTO from
# Tauri's size guide (https://tauri.app/concept/size/#cargo-configuration) linked the
# helper and the app single-threaded for most of each 11-16 minute release job.
[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "ApplicationModel",
  "ApplicationModel_Activation",
  "Foundation",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "=2.5.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "=0.25.0"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSData", "NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "=0.3.2", features = ["NSApplication", "NSEvent", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSWindow", "NSWorkspace", "block2"] }
block2 = "=0.6.2"
core-foundation = "=0.10.1"
