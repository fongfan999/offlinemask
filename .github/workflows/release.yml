# Release builds (decision 0103). Pushing a tag `vX.Y.Z` that matches the version in
# desktop/package.json builds the desktop app on every supported runner and attaches the
# bundles and a SHA256SUMS.txt to the GitHub release for that tag (created as a draft
# when it does not exist yet). "Run workflow" with a tag name rebuilds that tag using
# the workflow as it is on the chosen branch; without a tag it is a dry run that builds
# the chosen branch and keeps the bundles as run artifacts, attaching nothing.
#
# Per platform:
#   macOS arm64   native recognition helper (decision 0049), the verified path.
#   macOS Intel   WASM recognition: no native runtime is qualified for x86_64.
#   Windows x64   native recognition helper (decision 0077), verified and smoke-tested;
#                 also an MSIX for the Microsoft Store, kept as a run artifact (0117).
#   Linux x64     WASM recognition; deb and rpm (no AppImage, decision 0104). Untested.
#
# Without Apple secrets the macOS apps are signed ad hoc, so Apple Silicon does not
# report them as damaged, but Gatekeeper still asks the user to allow them. With
# APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY
# and one notarization set (APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID, or APPLE_API_ISSUER,
# APPLE_API_KEY, APPLE_API_KEY_PATH) they are signed with Developer ID and notarized
# by the Tauri CLI (https://v2.tauri.app/distribute/sign/macos/).
name: "Desktop: Release"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach (vX.Y.Z); empty builds this branch without attaching"
        required: false
        type: string

env:
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Check tag matches version (ubuntu-latest)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: version
        shell: bash
        run: |
          if [[ -n "$TAG" ]]; then
            git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG" || {
              echo "::error::$TAG is not a tag on origin; push the tag first." >&2
              exit 1
            }
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$TAG^{commit}")" ]]; then
              echo "::error::Checked-out commit is not the one $TAG points at." >&2
              exit 1
            fi
          else
            echo "::notice::No tag given: dry run of $GITHUB_REF_NAME, nothing will be attached."
          fi
          package=$(node -p "require('./desktop/package.json').version")
          tauri=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/src-tauri/Cargo.toml | head -1)
          echo "desktop/package.json $package, tauri.conf.json $tauri, Cargo.toml $cargo, tag $TAG"
          if [[ "$package" != "$tauri" || "$package" != "$cargo" ]]; then
            echo "::error::The three manifests disagree; keep them on one version (docs/product-direction.md)." >&2
            exit 1
          fi
          if [[ -n "$TAG" && "$TAG" != "v$package" ]]; then
            echo "::error::Tag $TAG does not match version $package; bump the manifests first (decision 0102)." >&2
            exit 1
          fi
          echo "version=$package" >> "$GITHUB_OUTPUT"
          echo "publish=$([[ -n "$TAG" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            command: desktop:build:native
            bundles: |
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
              desktop/artifacts/native-desktop/provenance.json
          - name: macos-x64
            os: macos-15-intel
            command: desktop:build
            bundles: |
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: windows-x64
            os: windows-latest
            command: desktop:build:native
            bundles: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
              desktop/artifacts/native-desktop/provenance.json
          - name: linux-x64
            os: ubuntu-22.04
            command: desktop:build --bundles deb,rpm
            bundles: |
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/rpm/*.rpm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: jdx/mise-action@v2
        env:
          # mise installs pnpm from the aqua registry, which ships no macOS x64 binary
          # for pnpm 11; that runner gets the same pinned version through npm below.
          MISE_DISABLE_TOOLS: ${{ matrix.name == 'macos-x64' && 'pnpm' || '' }}
      - name: Install pnpm through npm (macOS Intel only)
        if: matrix.name == 'macos-x64'
        env:
          MISE_DISABLE_TOOLS: pnpm
        run: |
          mise exec -- npm install --global pnpm@$(node -p "require('./package.json').engines.pnpm")
          mise exec -- pnpm --version
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          # One key per platform that changes only with the pinned toolchain and the
          # dependency graph. The action's own environment hash also covers every
          # rustc preinstalled on the runner image, which drifts between runs and
          # left the Linux cache unused (decision 0104).
          key: release-${{ matrix.name }}-${{ hashFiles('mise.toml', 'desktop/src-tauri/Cargo.lock', 'desktop/src-tauri/Cargo.toml', 'desktop/.cargo/config.toml') }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Apple signing (only when the secrets exist)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          # Export only the variables that are set, so the Tauri CLI never sees an empty one.
          for name in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY; do
            if [[ -n "${!name}" ]]; then echo "$name=${!name}" >> "$GITHUB_ENV"; fi
          done
          if [[ -n "$APPLE_API_KEY_CONTENT" ]]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$key"
            echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
          fi
          if [[ -n "$APPLE_CERTIFICATE" ]]; then
            # The native build signs the helper before the Tauri CLI runs, so the
            # certificate must already be in a keychain (keychain steps as in the Tauri guide).
            keychain="$RUNNER_TEMP/release.keychain-db"
            password=$(openssl rand -hex 16)
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
            security list-keychains -d user -s "$keychain" login.keychain-db
            rm "$RUNNER_TEMP/certificate.p12"
            echo "Developer ID certificate imported."
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "No Apple certificate: signing ad hoc."
          fi
      - run: mise exec -- pnpm install --frozen-lockfile
        env:
          MISE_DISABLE_TOOLS: ${{ matrix.name == 'macos-x64' && 'pnpm' || '' }}
      - run: mise exec -- pnpm -C desktop ${{ matrix.command }}
        env:
          MISE_DISABLE_TOOLS: ${{ matrix.name == 'macos-x64' && 'pnpm' || '' }}
      # The built app before packaging, so the "Windows: MSIX check" workflow can repackage
      # it in minutes instead of rebuilding (decision 0117).
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'windows-x64'
        with:
          name: windows-app-x64
          path: |
            desktop/src-tauri/target/release/OfflineMask.exe
            desktop/src-tauri/target/release/native/
            desktop/src-tauri/target/release/licenses/
          if-no-files-found: error
          retention-days: 30
      # Microsoft Store package (decision 0117). The unsigned .msix is what Partner Center
      # takes; it is kept as a run artifact, not attached to the GitHub release, because
      # Windows will not install an unsigned MSIX. A test-signed copy is installed and
      # started here, and kept with its .cer for a manual test on a real PC.
      - name: MSIX package (Windows)
        if: matrix.name == 'windows-x64'
        run: mise exec -- node desktop/scripts/build-msix.mjs --test-sign
      - name: Install, start and certify the MSIX (Windows)
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: ./desktop/scripts/check-msix.ps1
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'windows-x64'
        with:
          name: msix-windows-x64
          path: |
            desktop/artifacts/msix/*.msix
            desktop/artifacts/msix/*.cer
            desktop/artifacts/msix/wack-report.xml
          if-no-files-found: error
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p release-out
          shopt -s nullglob
          while IFS= read -r pattern; do
            [[ -z "$pattern" ]] && continue
            for file in $pattern; do cp "$file" release-out/; done
          done <<< "${{ matrix.bundles }}"
          ls -la release-out
          [[ -n "$(ls -A release-out)" ]] || { echo "::error::No bundles were produced." >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: offlinemask-${{ matrix.name }}
          path: release-out/*
          if-no-files-found: error

  publish:
    name: Attach to release (ubuntu-latest)
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          # Release bundles only; the MSIX artifact goes to Partner Center, not here.
          pattern: offlinemask-*
      - name: Checksums and release notes
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p upload
          for directory in bundles/*/; do
            platform=$(basename "$directory" | sed 's/^offlinemask-//')
            for file in "$directory"*; do
              name=$(basename "$file")
              # provenance.json is per platform; everything else already carries its arch.
              [[ "$name" == provenance.json ]] && name="provenance-$platform.json"
              cp "$file" "upload/$name"
            done
          done
          (cd upload && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} /^\[Unreleased\]:/ {f=0} f' CHANGELOG.md \
            | sed "s#](docs/#](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/#g; s#](SECURITY.md)#](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/SECURITY.md)#g" > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::warning::CHANGELOG.md has no section for $VERSION; using the tag name only."
            echo "OfflineMask $VERSION." > notes.md
          fi
          printf '\n%s\n' "macOS Apple Silicon and Windows x64 ship the native recognition helper; macOS Intel and Linux use WASM recognition, which is slower on long input. Only macOS Apple Silicon has been tested by hand. Verify a download against \`SHA256SUMS.txt\`." >> notes.md
      - name: Create or update the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "Release $TAG exists; attaching files."
          else
            gh release create "$TAG" --draft --verify-tag --title "OfflineMask $VERSION" --notes-file notes.md
            echo "Created draft release $TAG; publish it after checking the files."
          fi
          gh release upload "$TAG" upload/* --clobber
          gh release view "$TAG" --json url,isDraft,assets --jq '{url, isDraft, assets: [.assets[].name]}'
