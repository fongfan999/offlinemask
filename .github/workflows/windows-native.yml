# Windows x64 Rust tests with the native recognition feature (decisions 0077, 0125).
#
# Runs the crate's tests on a real Windows runner whenever the native layer changes, so
# Windows-only breakage shows up on the push rather than at the next release. The
# installers, the bundled-file verifier and the helper smoke test run in release.yml,
# on a tag or as a dry run ("Run workflow" on main without a tag).
name: "Desktop: Windows tests"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/src-tauri/**"
      - "desktop/.cargo/**"
      - ".github/workflows/windows-native.yml"
      - ".gitattributes"
      - "docs/licenses/**"
      - "mise.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise exec -- pnpm install --frozen-lockfile
      # Same keying as release.yml (decision 0124): the toolchain pin, plus the action's
      # own lockfile hash with a prefix fallback, so a version bump still starts warm.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: windows-test-${{ hashFiles('mise.toml', 'desktop/.cargo/config.toml') }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
      - run: mise exec -- cargo test --manifest-path src-tauri/Cargo.toml --locked --features recognition-native-sidecar
        working-directory: desktop
