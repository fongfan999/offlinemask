# Continuous checks for the frontend and the native layer.
#
# `verify` is the required job and mirrors the local commands in CONTRIBUTING.md.
# The repository is a pnpm workspace: lint runs at the root, the app's own checks
# run in desktop/ (so its .cargo/config.toml applies); landing.yml covers landing/.
# `portability` only compiles the Rust crate on Linux, which is not qualified yet; it is
# advisory. Windows is compiled, tested and packaged by windows-native.yml (decision 0077).
# Changes that only touch the landing page or documentation skip this workflow: landing.yml
# verifies landing/, and docs/licenses/ still counts because native builds bundle it.
name: "Desktop: Verify"

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!landing/**"
      - "!docs/**"
      - "!*.md"
      - "docs/licenses/**"
  pull_request:
    paths:
      - "**"
      - "!landing/**"
      - "!docs/**"
      - "!*.md"
      - "docs/licenses/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm lint
      - run: mise exec -- pnpm -C desktop build
      - run: mise exec -- pnpm -C desktop test
      - run: mise exec -- pnpm -C desktop check:native
      - run: mise exec -- pnpm -C desktop test:native

  portability:
    name: Native compile check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm -C desktop build
      - run: mise exec -- cargo check --manifest-path src-tauri/Cargo.toml --locked
        working-directory: desktop
