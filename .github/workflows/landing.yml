# Verifies the landing page. Cloudflare's GitHub integration builds and deploys
# offlinemask.com from main on its own (landing/README.md), so this workflow never deploys.
name: "Landing: Verify"

on:
  pull_request:
    paths:
      - "landing/**"
      - "brand/**"
      - "desktop/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - "eslint.config.js"
      - ".github/workflows/landing.yml"
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "brand/**"
      - "desktop/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - "eslint.config.js"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint and build check (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm lint
      - run: mise exec -- pnpm -C landing deploy:check
