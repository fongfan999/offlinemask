name: Landing page

on:
  pull_request:
    paths:
      [
        "landing/**",
        "src/theme.css",
        "brand/**",
        "package.json",
        "pnpm-lock.yaml",
        ".github/workflows/landing.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "landing/**",
        "src/theme.css",
        "brand/**",
        "package.json",
        "pnpm-lock.yaml",
        ".github/workflows/landing.yml",
      ]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this verified GitHub revision to Cloudflare Workers
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm lint
      - run: mise exec -- pnpm landing:deploy:check
      - uses: actions/upload-artifact@v4
        with:
          name: landing-${{ github.sha }}
          path: dist-landing
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: offlinemask-landing-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise exec -- pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: landing-${{ github.sha }}
          path: dist-landing
      - run: mise exec -- pnpm exec wrangler deploy --config landing/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
