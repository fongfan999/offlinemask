[package]
name = "offlinemask-minilm-tokenizer-prototype"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
unicode-normalization = "=0.1.24"
unicode-segmentation = "=1.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
strip = true
